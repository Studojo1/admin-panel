name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: acrstudojo-dhfsdrfhf6a6bbg2.azurecr.io
  ACR_NAME: acrstudojo
  APP_NAME: admin-panel
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Never ship an API route that answers without an admin login (AS-N01).
      - name: API routes require admin
        run: node scripts/check-api-auth.mjs

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          docker login ${{ env.REGISTRY }} -u 00000000-0000-0000-0000-000000000000 -p "$TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.APP_NAME }}:latest
          build-args: |
            VITE_CC_ADMIN_KEY=${{ secrets.CC_ADMIN_SECRET_KEY }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Secrets as secretKeyRef (audit ST-N07)
        run: |
          # Secrets reach the pod only as secretKeyRef, never as literal values
          # in the Deployment spec. BOB_SUPERADMIN_SECRET was set by hand; it is
          # adopted into app-secrets once (value kept) and referenced from then
          # on. scripts/ci/secret_env.sh explains.
          export NS=studojo DEP=${{ env.APP_NAME }}
          . scripts/ci/secret_env.sh
          secret_adopt BOB_SUPERADMIN_SECRET bob-superadmin-secret
          # Ticket replies are emailed from studojo@gmail.com over SMTP (gmail-direct.server.ts).
          secret_ref STUDOJO_GMAIL_APP_PASSWORD studojo-gmail-app-password
          secret_audit

      - name: Two replicas across nodes, with a PDB
        run: |
          # One replica went down for ~1.5 min on every node drain (AKS
          # maintenance, 2026-10-01). Two pods on different nodes plus a PDB
          # (minAvailable 1) keep one serving while a node drains.
          kubectl patch deployment/${{ env.APP_NAME }} -n studojo --type=strategic -p \
            '{"spec":{"replicas":2,"template":{"spec":{"topologySpreadConstraints":[{"maxSkew":1,"topologyKey":"kubernetes.io/hostname","whenUnsatisfiable":"DoNotSchedule","labelSelector":{"matchLabels":{"app":"${{ env.APP_NAME }}"}}}]}}}}'
          kubectl create pdb ${{ env.APP_NAME }} -n studojo --min-available=1 \
            --selector=app=${{ env.APP_NAME }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          # Start the new pod before stopping the old one: with one replica,
          # maxSurge=0 made every deploy a 503 window for admins (audit IN-N03).
          kubectl patch deployment/${{ env.APP_NAME }} -n studojo \
            -p '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}}}}'
          kubectl set image deployment/${{ env.APP_NAME }} ${{ env.APP_NAME }}=${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }} -n studojo
          kubectl rollout status deployment/${{ env.APP_NAME }} -n studojo --timeout=10m || {
            echo "Rollout failed or timed out. Checking pod status..."
            kubectl get pods -n studojo -l app=${{ env.APP_NAME }} -o wide
            echo ""
            echo "Recent pod events:"
            LATEST_POD=$(kubectl get pods -n studojo -l app=${{ env.APP_NAME }} --sort-by=.metadata.creationTimestamp -o jsonpath='{{.items[-1].metadata.name}}' 2>/dev/null || echo "")
            if [ -n "$LATEST_POD" ]; then
              kubectl get events -n studojo --field-selector involvedObject.name=$LATEST_POD --sort-by='.lastTimestamp' | tail -20 || true
              echo ""
              echo "Pod logs:"
              kubectl logs -n studojo $LATEST_POD --tail=50 || true
            fi
            exit 1
          }

      - name: Record deployment
        run: |
          curl -X POST https://api.studojo.com/v1/dev/deployments \
            -H "Content-Type: application/json" \
            -H "X-Deployment-Secret: ${{ secrets.DEPLOYMENT_SECRET }}" \
            -d '{
              "service": "${{ env.APP_NAME }}",
              "version": "${{ env.IMAGE_TAG }}",
              "deployed_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
              "deployed_by": "${{ github.actor }}",
              "status": "success",
              "workflow_run": ${{ github.run_id }}
            }' || echo "Failed to record deployment (non-critical)"