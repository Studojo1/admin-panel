# Runs on every pull request and every push to main/staging.
name: Tests

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every app/routes/api.*.tsx loader/action must require an admin login
      # (audit AS-N01: /api/posthog and /api/settings shipped without one).
      - run: node scripts/check-api-auth.mjs
      - run: node --test scripts/check-api-auth.test.mjs
      # The rules behind the "Needs attention" card on /daily: when lead
      # discovery counts as failing, and why a paying customer got no email.
      - run: node --test scripts/health-watch.test.mjs
      # EMAIL-PAUSE (29 Oct 2026): the app's own email stays held unless
      # EMAILS_PAUSED=0.
      - run: node --test scripts/email-pause.test.mjs
      # Stu tracking (2 Nov 2026): IST days, the sign-up cohort, truth over the
      # journey log, nested gates, the 2% self-check, retention.
      - run: node --test scripts/stu-model.test.mjs
      # Stu Auditor (4 Nov 2026): every failure in plain words, ours (Broke) or
      # maybe the student's (Check), the IST window, the since-yesterday line.
      - run: node --test scripts/stu-auditor.test.mjs
      # AUDITOR-FLAGS (7 Nov 2026): the flags tab of the Auditor: level mismatch, clipped emails, the window, the words and the reads.
      - run: node --test scripts/stu-flags.test.mjs
      # VISITORS (4 Nov 2026): real visitors (a page_view), likely bots, crawlers, the first-touch source, the funnel
      # per source and the furthest step of those who did not sign up.
      - run: node --test scripts/visitors-model.test.mjs
      # RECORDINGS (5 Nov 2026): the /recordings filters, the furthest step in a visit, career-agent's chunk names, the
      # tracks a visit plays as, the journey markers, and the wiring (admin gate, the Journeys link, storage refs).
      - run: node --test scripts/recordings-model.test.mjs
      # TALENT (12 Nov 2026): the /talent search: the words a search is read into, where a student matches, the hard
      # filters (city with Delhi NCR as one market, budget in the student's unit), the ranking.
      - run: node --test scripts/talent-model.test.mjs
      # TALENT-NET (12 Nov 2026): every student in one career family and canonical role (synonyms, refusals, the order
      # of evidence, not enough data), the network's counts and its layout.
      - run: node --test scripts/talent-families.test.mjs
      # CUSTOMERS (13 Nov 2026): the /customers page: the rank, thanks and complaints in a customer's own messages, the
      # tags, the views, the search and order, and pasted links.
      - run: node --test scripts/customers-model.test.mjs
      # UTM links (2 Nov 2026): the naming scheme, utm_id = slug first, utm_*
      # as the fallback, IST ranges, internal accounts and bots apart.
      - run: node --test scripts/utm-attribution.test.mjs
      # Vendors and credits (2 Nov 2026): balance answers (402, 403
      # API_INACCESSIBLE, 422), burn per IST day, days left, the next-thing line.
      - run: node --test scripts/vendors-model.test.mjs
      # TICKET-REF (3 Nov 2026): tickets named and numbered as the student sees
      # them in Stu ("Your ticket 2: ..."), and the search by email or name
      # plus that number.
      - run: node --test scripts/ticket-label.test.mjs
      # Deploy workflows never write a secret into a Deployment as a literal
      # env value (audit ST-N07).
      - run: bash scripts/ci/check_no_literal_secrets.sh
